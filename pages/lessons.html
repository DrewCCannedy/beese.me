<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beece - Lessons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container mt-4">
        <!-- Title -->
        <div class="row mb-4">
            <div class="col-12 text-center">
                <h1>Lessons</h1>
            </div>
        </div>
        
        <!-- Description -->
        <div class="row mb-4">
            <div class="col-12 text-center">
                <p class="lead">I like to play many instruments. I like to teach many, too.</p>
            </div>
        </div>
        
        <!-- Two Columns Section -->
        <div class="row mb-5">
            <!-- Instruments List -->
            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h3 class="card-title">I teach:</h3>
                        <ul class="list-unstyled">
                            <li>Guitar</li>
                            <li>Bass</li>
                            <li>Drums</li>
                            <li>Banjo</li>
                            <li>Ukelele</li>
                            <li>Mandolin</li>
                            <li>& many more!</li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <!-- Image -->
            <div class="col-md-6 mb-4">
                <img src="../images/lessons-detail.jpg" alt="Music Lessons" class="img-fluid rounded">
            </div>
        </div>
        
        <!-- Additional Info -->
        <div class="row mb-4">
            <div class="col-12 text-center">
                <p class="lead">I also teach theory & production</p>
            </div>
        </div>
        
        <!-- Book Button -->
        <div class="row mb-4">
            <div class="col-12 text-center">
                <a href="contact.html" class="btn btn-primary btn-lg">Book A Lesson Now</a>
            </div>
        </div>
        
        <!-- Home Link -->
        <div class="row mb-5">
            <div class="col-12 text-center">
                <a href="../index.html" class="btn btn-outline-secondary">Back to Home</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
