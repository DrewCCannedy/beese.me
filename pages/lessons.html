<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beece - Lessons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container mt-4">
        <!-- Title -->
        <div class="row mb-4">
            <div class="col-12 text-center">
                <h1 class="page-title">Lessons</h1>
            </div>
        </div>
        
        <!-- Description -->
        <div class="row mb-4">
            <div class="col-12 text-center">
                
            </div>
        </div>
        
        <!-- Two Columns Section -->
        <div class="row mb-5">
            <!-- Instruments List -->
            <div class="col-6 mb-4">
                <p class="lead ms-3">I like to play many instruments. I like to teach many, too.</p>
                <div class="card h-100">
                    <div class="card-body">
                        <h3 class="card-title">I teach:</h3>
                        <div class="instrument-list">
                            <div class="instrument" style="font-size: 1.8rem; margin-left: 10px;">Guitar</div>
                            <div class="instrument" style="font-size: 1.2rem; margin-left: 50px;">Bass</div>
                            <div class="instrument" style="font-size: 2.2rem; margin-left: 20px;">Drums</div>
                            <div class="instrument" style="font-size: 1.5rem; margin-left: 70px;">Banjo</div>
                            <div class="instrument" style="font-size: 1.7rem; margin-left: 30px;">Ukelele</div>
                            <div class="instrument" style="font-size: 1.4rem; margin-left: 45px;">Mandolin</div>
                            <div class="instrument" style="font-size: 1.9rem; margin-left: 15px;">&amp; many more!</div>
                        </div>
                    </div>
                    <div class="mt-auto pt-3 border-top">
                        <p class="text-center lead" style="font-size: 1.6rem;">I also teach theory &amp; production</p>
                    </div>
                </div>
            </div>
            
            <!-- Image -->
            <div class="col-6 mb-4">
                <img src="../images/lessons-detail.jpg" alt="Music Lessons" class="img-fluid">
            </div>
        </div>
        
        <!-- Book Button -->
        <div class="row mb-4">
            <div class="col-12 text-center">
                <a href="contact.html" class="btn btn-primary btn-lg">Book A Lesson Now</a>
            </div>
        </div>
        
        <!-- Home Link -->
        <div class="row mb-5">
            <div class="col-12 text-center">
                <a href="../index.html" class="btn btn-outline-secondary">Back to Home</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
