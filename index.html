<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beece - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container mt-4">
        <!-- Top Image -->
        <div class="row mb-4">
            <div class="col-12">
                <img src="images/header-image.jpg" alt="Beece" class="img-fluid w-100">
            </div>
        </div>
        
        <!-- What I Do Section -->
        <div class="row mb-2">
            <div class="col-12">
                <h2 class="what-i-do">WHAT I DO:</h2>
            </div>
        </div>
        
        <!-- Services Section -->
        <div class="row mb-2">
            <!-- Lessons Column -->
            <div class="col-6 mb-4">
                    <!-- Title Row -->
                    <div class="row mb-2">
                        <div class="col-12 text-center">
                            <h3>Lessons</h3>
                        </div>
                    </div>
                    <!-- Image Row -->
                    <div class="row mb-4">
                        <div class="col-12">
                            <img src="images/lessons.jpg" alt="Music Lessons" class="img-fluid service-img">
                        </div>
                    </div>
                    <!-- Button Row -->
                    <div class="row">
                        <div class="col-12 text-center">
                            <a href="pages/lessons.html" class="btn btn-primary">BOOK NOW</a>
                        </div>
                    </div>
            </div>
            
            <!-- Production Column -->
            <div class="col-6 mb-4">
                <!-- Title Row -->
                <div class="row mb-2">
                    <div class="col-12 text-center">
                        <h3>Production</h3>
                    </div>
                </div>
                <!-- Image Row -->
                <div class="row mb-4">
                    <div class="col-12">
                        <img src="images/production.jpg" alt="Music Production" class="img-fluid service-img">
                    </div>
                </div>
                <!-- Button Row -->
                <div class="row">
                    <div class="col-12 text-center">
                        <a href="pages/production.html" class="btn btn-primary">LET'S TALK</a>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Beese Logo Section -->
        <div class="row mb-2">
            <div class="col-12 text-center">
                <div class="beese-logo">
                    <h1>BEESE</h1>
                </div>
            </div>
        </div>
        
        <!-- Footer Button -->
        <div class="row mb-5">
            <div class="col-12 text-center">
                <p class="btn btn-secondary">beese.me</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
