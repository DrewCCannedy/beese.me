<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beece - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container mt-4">
        <!-- Top Image -->
        <div class="row mb-4">
            <div class="col-12">
                <img src="images/header-image.jpg" alt="Beece" class="img-fluid w-100">
            </div>
        </div>
        
        <!-- What I Do Section -->
        <div class="row mb-4">
            <div class="col-12 text-center">
                <h2 class="what-i-do">WHAT I DO:</h2>
            </div>
        </div>
        
        <!-- Services Section -->
        <div class="row mb-5">
            <!-- Lessons Column -->
            <div class="col-md-6 mb-4">
                <div class="service-box text-center">
                    <h3>Lessons</h3>
                    <img src="images/lessons.jpg" alt="Music Lessons" class="img-fluid service-img mb-3">
                    <a href="pages/lessons.html" class="btn btn-primary">Book Now</a>
                </div>
            </div>
            
            <!-- Production Column -->
            <div class="col-md-6 mb-4">
                <div class="service-box text-center">
                    <h3>Production</h3>
                    <img src="images/production.jpg" alt="Music Production" class="img-fluid service-img mb-3">
                    <a href="pages/production.html" class="btn btn-primary">Let's talk</a>
                </div>
            </div>
        </div>
        
        <!-- Beese Logo Section -->
        <div class="row mb-4">
            <div class="col-12 text-center">
                <div class="beese-logo">
                    <h1>BEESE</h1>
                </div>
            </div>
        </div>
        
        <!-- Footer Button -->
        <div class="row mb-5">
            <div class="col-12 text-center">
                <a href="https://beese.me" class="btn btn-secondary">beese.me</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
